pipeline:
  clone:
    enabled: false
  timeout: 10m
  inputs:
    head_sha:
      type: string
      default: ''
  env:
    CI_ENABLE_HCLI_FOR_TESTS: 'true'
  stages:
  - id: conditional_validation
    runtime: cloud
    clone:
      enabled: false
    cache:
      enabled: false
    steps:
    - id: checkout_exact_commit
      run:
        shell: bash
        script: |
          set -eu
          python3 - <<'PY'
          import os,re,subprocess
          sha=os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha), 'Exact commit SHA required'
          subprocess.run(['git','init'],check=True)
          subprocess.run(['git','remote','add','origin','https://github.com/ansibleautomates/oss-ci-isolation-lab.git'],check=True)
          subprocess.run(['git','-c','credential.helper=','fetch','--depth=1','origin',sha],check=True)
          subprocess.run(['git','checkout','--detach','FETCH_HEAD'],check=True)
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual==sha, 'Checkout revision mismatch'
          print('VERIFIED_CONTRIBUTOR_SHA='+actual)
          PY
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
    - id: probe_before
      run:
        shell: bash
        script: python3 scripts/probe_boundaries.py
    - id: same_repository_secret
      run:
        shell: bash
        script: |
          python3 - <<'PY'
          import os,json
          assert os.environ['OSS_CI_CANARY'].startswith('synthetic-only-')
          print(json.dumps({'trusted_secret_step_executed':True,'canary_resolved':True}))
          PY
        env:
          OSS_CI_CANARY: <+secrets.getValue("oss_ci_canary")>
      if: <+Always>
    - id: probe_after
      run:
        shell: bash
        script: python3 scripts/probe_boundaries.py
    - id: build_and_run
      run:
        shell: bash
        script: |
          set -eu
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
          .venv/bin/python -m compileall -q app.py
          mkdir -p dist
          cp app.py dist/app.py
          .venv/bin/python app.py
    - id: test
      run:
        shell: bash
        script: |
          set -eu
          .venv/bin/python -m pytest -q --junitxml=reports/junit.xml --cov=app --cov-report=lcov:reports/lcov.info --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage-html --cov-report=term-missing
    - id: upload_reports
      run:
        shell: bash
        script: |
          set -eu
          if [ -f reports/junit.xml ]; then
            hcli test-reports upload reports/junit.xml
          fi
          if [ -f reports/lcov.info ]; then
            hcli cov upload --file=reports/lcov.info
          fi
      if: <+Always>
  - id: trusted_reporting
    runtime: cloud
    clone:
      enabled: false
    cache:
      enabled: false
    steps:
    - id: post_commit_status
      run:
        shell: bash
        script: |
          set -eu
          python3 - <<'PY'
          import json,os,re,urllib.request
          sha=os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          status=os.environ['VALIDATION_STATUS']
          assert status in {'Success','SUCCEEDED','Succeeded','Failed','FAILED','Failure','Aborted','ABORTED','Expired','ERRORED','Errored','Skipped','SKIPPED'}, 'Unknown validation status: '+status
          success=status in {'Success','SUCCEEDED','Succeeded'}
          execution=os.environ['EXECUTION_ID']
          assert re.fullmatch(r'[A-Za-z0-9_-]+',execution)
          url='https://unifiedpipeline.harness.io/ng/account/MGY3MmJmM2ItNTY5Ny00Yj/all/orgs/default/projects/chef_oss_pov/pipelines/oss_ci_conditions/deployments/'+execution+'/pipeline'
          payload={'state':'success' if success else 'failure','context':'harness/conditional-guard','description':'CI trust-boundary validation '+('passed' if success else 'failed'),'target_url':url}
          req=urllib.request.Request('https://api.github.com/repos/ansibleautomates/oss-ci-isolation-lab/statuses/'+sha,method='POST',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['OSS_CI_ASSETS_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
          assert result['state']==payload['state']
          print(json.dumps({'github_status_posted':result['state'],'context':result['context'],'commit':sha,'contributor_code_executed':False}))
          PY
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
          VALIDATION_STATUS: <+pipeline.stages.conditional_validation.status>
          EXECUTION_ID: <+pipeline.executionId>
          OSS_CI_ASSETS_TOKEN: <+secrets.getValue("oss_ci_assets_token")>
    if: <+Always>
